# ── 每天台灣時間 18:10 自動海巡（Threads + IG + FB）+ Telegram 發布前通知 ──
# Secrets（Settings → Secrets and variables → Actions）：
#   THREADS_AUTH_B64     auth_state.json 的 base64（必要）
#   IG_AUTH_B64          ig_auth_state.json 的 base64（沒設就跳過 IG）
#   FB_AUTH_B64          fb_auth_state.json 的 base64（沒設就跳過 FB）
#   TELEGRAM_BOT_TOKEN   Telegram bot token
#   TELEGRAM_CHAT_ID     你的 Telegram chat id
#
# 注意：GitHub 排程可能比表定時間晚 3～15 分鐘（平台特性）。
# 手動測試：Actions 頁籤 → threads-patrol → Run workflow

name: threads-patrol

on:
  schedule:
    - cron: "10 10 * * *" # UTC 10:10 = 台灣 18:10
  workflow_dispatch:

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝 Playwright（用系統 Chrome，不另外下載瀏覽器）
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund playwright

      - name: 還原登入憑證
        env:
          THREADS_AUTH_B64: ${{ secrets.THREADS_AUTH_B64 }}
          IG_AUTH_B64: ${{ secrets.IG_AUTH_B64 }}
          FB_AUTH_B64: ${{ secrets.FB_AUTH_B64 }}
        run: |
          mkdir -p output
          if [ -n "$THREADS_AUTH_B64" ]; then echo "$THREADS_AUTH_B64" | base64 -d > auth_state.json; else echo "⚠️ 未設 THREADS_AUTH_B64，將跳過 Threads"; fi
          if [ -n "$IG_AUTH_B64" ];      then echo "$IG_AUTH_B64"      | base64 -d > ig_auth_state.json; else echo "⚠️ 未設 IG_AUTH_B64，將跳過 IG"; fi
          if [ -n "$FB_AUTH_B64" ];      then echo "$FB_AUTH_B64"      | base64 -d > fb_auth_state.json; else echo "⚠️ 未設 FB_AUTH_B64，將跳過 FB"; fi

      - name: Threads 海巡
        if: ${{ hashFiles('auth_state.json') != '' }}
        continue-on-error: true
        run: xvfb-run --auto-servernum node patrol.js

      - name: 更新自己的 Threads 貼文與留言素材
        if: ${{ hashFiles('auth_state.json') != '' }}
        continue-on-error: true
        env:
          SELF_REPLY_POSTS: "100"
        run: xvfb-run --auto-servernum node crawl_self.js

      - name: IG 海巡
        if: ${{ hashFiles('ig_auth_state.json') != '' }}
        continue-on-error: true
        run: xvfb-run --auto-servernum node ig_patrol.js

      - name: FB 海巡
        if: ${{ hashFiles('fb_auth_state.json') != '' }}
        continue-on-error: true
        run: xvfb-run --auto-servernum node fb_patrol.js

      - name: Telegram 發布前通知
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node notify_telegram.js

      - name: 等待 Telegram 核准社群留言（30 分鐘）
        if: ${{ hashFiles('output/*replies_draft.json') != '' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run --auto-servernum node telegram_approvals.js --wait 1800

      - name: 自動回答有留言素材的 Threads 徵求文
        if: ${{ hashFiles('auth_state.json') != '' }}
        continue-on-error: true
        run: xvfb-run --auto-servernum node reply.js --live --auto-solicit

      - name: 上傳結果檔（CSV / JSON / 回覆稿）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-output-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
